name: update-morphology

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch newest morphology version
        run: |
          git clone --depth 1 https://github.com/Indic-AI-Experiments/tamil-morphology.git /tmp/tamil-morphology
          tar -czf /tmp/tamil-morphology-release.tar.gz \
            -C /tmp tamil-morphology/manifest.json tamil-morphology/runtime
      - name: Verify and install runtime
        run: |
          python scripts/install_morphology_release.py /tmp/tamil-morphology-release.tar.gz \
            --runtime-dir server/fst-models \
            --lock-file morphology.lock.json
      - name: Verify consumer copies and run FST regressions
        run: |
          sudo apt-get update
          sudo apt-get install -y foma
          diff -qr /tmp/tamil-morphology/runtime server/fst-models
          python3 scripts/verify_morphology_lock.py --runtime-dir server/fst-models
          python3 /tmp/tamil-morphology/fst/tests/run_fst_regressions.py
      - name: Open tested update pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch=automation/update-tamil-morphology
          git add -f -- morphology.lock.json server/fst-models
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Update Tamil morphology release"
          git push --force origin "HEAD:refs/heads/$branch"
          gh pr view "$branch" --json number >/dev/null 2>&1 || \
            gh pr create \
              --base main \
              --head "$branch" \
              --title "Update Tamil morphology release" \
              --body "Automated checksum-verified update from Indic-AI-Experiments/tamil-morphology. Solladukku's FST regression suite passed."
